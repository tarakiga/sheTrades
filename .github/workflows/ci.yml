name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      # Prisma 7 no longer generates the client on install, so without this
      # `tsc` sees a stub @prisma/client with no PrismaClient export and the
      # backend typecheck fails on 17 files. The backend-tests job below has
      # always had this step; this job did not, and nobody noticed because
      # Lint failed first for weeks and Typecheck never ran.
      - name: Generate Prisma client
        run: npx prisma generate --schema=backend/prisma/schema.prisma

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # No Prettier gate. The repo has a .prettierrc.json and `npm run format`,
      # but the code was never written with it: `prettier --check .` fails on
      # ~380 tracked files, 330 of them .ts/.tsx across backend/ and dashboard/.
      # This step never passed. Enforcing it means one deliberate repo-wide
      # `npm run format` commit (with a .git-blame-ignore-revs entry), not a
      # CI step that is red forever. Restore it in the same commit that does that.

      - name: Dashboard build
        run: npm run build -w @shetrades/dashboard

  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shetrades_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/shetrades_test
      # The postgres service container has no TLS. The backend defaults
      # PG_SSL_ENABLED to true (right for Cloud SQL), so the config-platform
      # migrator would otherwise fail with "The server does not support SSL".
      PG_SSL_ENABLED: "false"
      ADMIN_CONFIG_JWT_SECRET: ci-test-secret
      ADMIN_REPORTS_API_TOKEN: ci-test-reports-token
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate --schema=backend/prisma/schema.prisma

      - name: Set up test database schema
        run: npm run db:setup:test -w @shetrades/backend

      # Tests run serially (--test-concurrency=1) so files don't race on the
      # shared Postgres (several suites reset/clear tables between cases).
      - name: Run backend tests
        run: npm run test:ci -w @shetrades/backend
